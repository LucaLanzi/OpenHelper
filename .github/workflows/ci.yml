name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tools the language-pack checks use in tests
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-pytest
          pipx install ruff
          pipx install mypy
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: shellcheck -x openhelper scripts/*.sh packs/languages/scripts/*.sh
