# Reference desktop: Ubuntu 24.04, RTX 2080 Ti (11 GB), 32 GB RAM.
name = "desktop"
description = "Ubuntu desktop with the 2080 Ti"
url = "http://127.0.0.1:8740"
os = "linux"
token_ref = "desktop"
agents = ["planner", "coder", "reviewer", "explainer"]
# Generated code runs automatically only inside a sandbox. Build it with `scripts/sandbox-vm.sh`.
auto_run = false

[model]
current = "qwen3.6-35b-a3b-q4km"
light = "qwen3-8b-q4km"
embed = ""
allowed = ["qwen3.6-35b-a3b-q4km", "qwen3-8b-q4km", "gemma-4-26b-a4b-q4km"]

# Per-model llama-server settings for this machine. `scripts/tune.sh` measures n_cpu_moe.
[model_overrides."qwen3.6-35b-a3b-q4km"]
ctx = 32768
extra_args = []

[resources]
unload_after_min = 30
batch_jobs = "manual"

[sandbox]
driver = "none"   # docker or podman once the sandbox image is built
image = "openhelper-sandbox:latest"
