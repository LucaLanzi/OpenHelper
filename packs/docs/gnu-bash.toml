id = "gnu-bash"
name = "GNU Bash reference manual"
version = "latest"
license = "GFDL-1.3; fetched by each user"
redistributable = false
homepage = "https://www.gnu.org/software/bash/manual/"
verified = false

[[sources]]
url = "https://www.gnu.org/software/bash/manual/bash.html"
format = "html"

# When gnu.org cannot be reached, use the release tarball from GNU's mirrors.
# Since 4.4 it includes the formatted reference manual.
[[sources.alternatives]]
url = "https://ftpmirror.gnu.org/bash/bash-5.3.tar.gz"
format = "tar"
subdir = "doc/bashref.html"

[[sources.alternatives]]
url = "https://mirrors.kernel.org/gnu/bash/bash-5.3.tar.gz"
format = "tar"
subdir = "doc/bashref.html"
